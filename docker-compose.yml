version: '3.9'

services:
  backend:
    build: ./backend
    # 4 uvicorn workers = ~200 concurrent users comfortably
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop
    env_file: .env
    volumes:
      - ./data:/app/../data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
